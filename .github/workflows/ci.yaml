name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + typecheck + unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false # references/ submodules are not needed for lint/unit CI

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install CPU-only torch + project deps
        run: |
          uv venv --python 3.12
          # --no-config: the pytorch index serves no upload timestamps, and uv's
          # exclude-newer pin (pyproject [tool.uv]) excludes timestamp-less files
          # entirely. The ==2.13.0 pin matches the Containerfile base image and
          # restores the reproducibility exclude-newer provided.
          uv pip install --no-config "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev

      # --no-sync everywhere: a bare `uv run` re-syncs the env from pyproject
      # and would replace the CPU-only torch wheel installed above with the
      # multi-GB CUDA build from the default index.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      # basedpyright was a LOCAL-ONLY gate: `just check` ran it, CI did not, so a
      # strict-typecheck failure could sit red on a branch while every PR check
      # stayed green (it did, on fix/review-round-1). Results are stub-dependent,
      # so it has to run against the SAME torch as the pin above, not uv.lock's
      # newer resolve — verified clean under the 2.13.0 CPU wheel before landing.
      - name: Typecheck (basedpyright, strict)
        run: uv run --no-sync basedpyright src scripts

      - name: Unit tests (pytest -m unit, CPU only)
        env:
          ENTROPIC_SUBSTRATE_DEVICE: cpu
        run: uv run --no-sync pytest -m unit -q --maxfail=1 --disable-warnings
