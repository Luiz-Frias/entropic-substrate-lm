name: CI

on:
  push:
    # refactor/**: the hexagonal-refactor sprint trunk (operator ruling 2026-09-19);
    # without it no sprint push or PR ran CI and lint-imports had no channel to stop
    # a merge (measured on PR #285: 0 workflow runs before this trigger landed).
    # ci/**: CI-tuning probe branches (FOR-1618, 2026-09-28). Each probe is a
    # single config change measured on its own runner; without this entry a
    # pushed probe branch ran nothing (the base ci/xdist-unit-suite had exactly
    # 1 run, and that one was PR #307's pull_request event onto main).
    branches: [main, 'refactor/**', 'ci/**']
  pull_request:
    # mythwave/**: stacked lane PRs base on the previous lane branch, so the
    # refactor/** filter never matched them (measured on PR #286: 0 runs);
    # operator ruling 2026-09-20. The filter matches the PR's BASE branch.
    # ci/**: a PR whose BASE is a ci/ probe trunk (FOR-1618's deliverable
    # bases on ci/xdist-unit-suite) matched none of the entries above and
    # could not run CI at all (filter read 2026-09-28).
    branches: [main, 'refactor/**', 'mythwave/**', 'ci/**']

# Least-privilege default: every step below only checks out and reads the repo
# (lint, typecheck, unit tests, import-lint) — no push, comment, or artifact write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + typecheck + unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # references/ submodules are not needed for lint/unit CI

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install CPU-only torch + project deps
        run: |
          uv venv --python 3.12
          # --no-config: the pytorch index serves no upload timestamps, and uv's
          # exclude-newer pin (pyproject [tool.uv]) excludes timestamp-less files
          # entirely. The ==2.13.0 pin matches the Containerfile base image and
          # restores the reproducibility exclude-newer provided.
          uv pip install --no-config "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev

      # --no-sync everywhere: a bare `uv run` re-syncs the env from pyproject
      # and would replace the CPU-only torch wheel installed above with the
      # multi-GB CUDA build from the default index.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      # basedpyright was a LOCAL-ONLY gate: `just check` ran it, CI did not, so a
      # strict-typecheck failure could sit red on a branch while every PR check
      # stayed green (it did, on fix/review-round-1). Results are stub-dependent,
      # so it has to run against the SAME torch as the pin above, not uv.lock's
      # newer resolve — verified clean under the 2.13.0 CPU wheel before landing.
      - name: Typecheck (basedpyright, strict)
        run: uv run --no-sync basedpyright src scripts

      # xdist 3.8.0 `-n auto` = psutil.cpu_count(logical=False) when psutil is
      # importable (xdist/plugin.py pytest_xdist_auto_num_workers; psutil is in
      # the deploy group, which dev includes), and `-q` hides xdist's
      # "N workers" header (dsession.py: shown only at verbose >= 0). So the
      # worker count the suite actually ran with was never in the log. This
      # step prints the same numbers xdist reads, on the same runner, before
      # the suite starts.
      - name: Runner CPU topology (xdist -n auto = psutil physical cores)
        run: |
          nproc
          uv run --no-sync python -c "import os, psutil; print('physical', psutil.cpu_count(logical=False), 'logical', os.cpu_count(), 'affinity', len(os.sched_getaffinity(0)))"

      - name: Unit tests (pytest -m unit, CPU only)
        env:
          ENTROPIC_SUBSTRATE_DEVICE: cpu
        # MEASURED 2026-09-28, step span (started_at -> completed_at of THIS
        # step, GitHub Actions jobs API), ubuntu-latest:
        #   serial (run 36446994821, 651af30):      24m56s  15:54:16Z -> 16:19:12Z
        #   -n auto --dist loadfile (run 36466114767, ef8bdf1): 23m06s  18:35:09Z -> 18:58:15Z
        #     summary: 5116 passed, 1 skipped in 1381.38s
        # RETRACTION: the previous comment quoted 25m53s for the serial run;
        # that was the RUN span (run created_at -> updated_at, 15:53:25Z ->
        # 16:19:18Z: queueing and install included), not this step. Every
        # figure here is the step span.
        # --durations: pytest-core, aggregated at the controller across xdist
        # workers, so the long-pole tests are in the log and never inferred.
        # FOR-1618 hill-climb ledger (probe, SHA, run ID, verdict) lives in
        # the PR that carries this comment.
        run: uv run --no-sync pytest -m unit -q --maxfail=1 --disable-warnings -n auto --dist loadfile --durations=60 --durations-min=1.0

      # Teeth for tests/test_subprocess_env_hygiene.py at the regime that bit:
      # a test that re-syncs .venv from uv.lock swaps the CPU wheel above for
      # the CUDA build (MEASURED 2026-09-28, FOR-1618: three two-worker runs
      # died in cold-import children mid-reinstall). If torch is no longer the
      # +cpu wheel after the suite, something in the suite rewrote the env.
      - name: Venv unchanged by the suite (torch is still the +cpu wheel)
        run: |
          uv run --no-sync python -c "import sys, torch; v = torch.__version__; print('torch', v); sys.exit(0 if v.endswith('+cpu') else 1)"

      # p0-contract-pin (operator ruling 2026-09-18): a channel that can stop
      # a merge, not just a local `just check` a contributor can skip. Layers
      # contract over the LANDED layers, __legacy outside it until p13.
      - name: Import layers (lint-imports)
        run: uv run --no-sync lint-imports
