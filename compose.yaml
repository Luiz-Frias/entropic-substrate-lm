# Local live MLflow stack for `just container-test` (podman-compose).
#
# postgres = MLflow's backend store (params/metrics/tags/runs). mlflow = the
# tracking server, artifacts proxied through it to the REAL Cloudflare R2
# bucket (s3://entropic-substrate-lm/mlflow/) — never MinIO. R2's boto3
# checksum behaviour is invisible against MinIO, which is exactly why the
# live test must point at real R2 (see CLAUDE.md's R2 COMPATIBILITY note).
#
# NO FIXED HOST PORT: the mlflow service below publishes only the container
# port ("5000", no "host:container" mapping) — podman assigns an EPHEMERAL
# host port, which scripts/run_container_test.sh discovers via `podman port`
# after the container is up and builds MLFLOW_TRACKING_URI from whatever was
# actually assigned. A fixed host port ("5001:5000", the previous shape —
# 5001 chosen only to dodge macOS AirPlay squatting on 5000) is a
# concurrency hazard: two worktrees running `just container-test` at once
# would collide on the same host port regardless of the (also now
# per-worktree) project name below.
#
# PROJECT NAME (see run_container_test.sh): derived per-worktree, not fixed
# — a fixed, shared compose project name is what let one agent's mlflow
# container fuse to a DIFFERENT agent's postgres under concurrent runs
# (verified empirically via `com.docker.compose.project.working_dir`
# container labels) — a run could validate against another run's database
# and report green.
#
# Credentials come from the repo's .env (mise loads it into the environment
# already; podman-compose additionally reads a sibling .env for ${VAR}
# interpolation here) — never hardcoded.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    # NAMED volume, not an anonymous one: `down` (no `-v`, the failure-path
    # teardown below) only preserves data that's findable afterward. An
    # anonymous volume survives `down` too but as an unlabelled dangling
    # 64-hex ID nothing can point an operator at; naming it makes "survives
    # for diagnosis" actually diagnosable (podman names it
    # `${PROJECT}_pgdata` — verified empirically against this same
    # compose.yaml shape).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  mlflow:
    build:
      context: .
      dockerfile: Containerfile.mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      # R2 COMPATIBILITY knobs (CLAUDE.md): recent AWS SDKs send integrity
      # checksums R2 has historically rejected. Set here so every client of
      # this server — not just the training host — inherits the fix.
      # Empirically verified against the real bucket by `just
      # container-test`'s artifact-round-trip integration test.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_DEFAULT_REGION: auto
      # HOST ALLOWLIST (p3) — MLflow's OWN env vars. These are not a
      # convention we invented: mlflow/utils/cli_args.py:256,270 in the
      # pinned image binds --allowed-hosts / --cors-allowed-origins to
      # MLFLOW_SERVER_ALLOWED_HOSTS / MLFLOW_SERVER_CORS_ALLOWED_ORIGINS via
      # click's native envvar=, so setting them here IS passing the flags,
      # and command: below stays a flat argv list with no shell at all.
      #
      # WHY THIS AND NOT A COMMAND-LINE FLAG — the flag form was a MEASURED
      # injection. Reading these vars inside an sh -c script as unescaped
      # ${VAR} let podman-compose 1.6.0 interpolate HOST-SIDE, at
      # `config`/`up` parse time, from this process's raw environment:
      # setting MLFLOW_ALLOWED_HOSTS to `foo.test"; touch /tmp/PWNED ; echo "`
      # rendered that literal shell text into the container's startup
      # script — arbitrary command execution gated only by who can set an
      # env var. Escaping it ($$VAR) deferred expansion to the container's
      # own shell and closed the hole, but a correctly-escaped
      # interpolation site is still an interpolation site. There is now no
      # site: podman hands these to the container's exec() environ array,
      # which nothing re-parses as shell. Same pure-data-channel idiom as
      # the AWS_*/MLFLOW_S3_ENDPOINT_URL vars above.
      #
      # EMPTY MEANS UNSET, and that is what makes the `:-` default safe.
      # MEASURED against the pinned image, ONE container at a time (see the
      # worker comment below — concurrent probes on this 4-vCPU VM look
      # exactly like a hang and will mislead you): both vars set to "" boot
      # in ~7s logging "Security middleware enabled with default settings
      # (localhost-only)", identical to omitting them. So an operator who
      # sets nothing gets today's localhost-only behaviour with no
      # conditional-flag machinery, and one who sets a domain gets it
      # enforced — verified in the real compose stack (postgres + R2):
      # allowed Host -> 200, foreign Host -> 403 on both the REST API and
      # the UI, foreign Host -> 200 on /health (that exemption is upstream's
      # and is pinned by tests/test_mlflow_live.py).
      #
      # The operator-facing names stay MLFLOW_ALLOWED_HOSTS /
      # MLFLOW_CORS_ALLOWED_ORIGINS — .env, the Railway service, and the
      # live-test fixtures all keep the names they already use.
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:-}
    # Bare container port — ephemeral host port assigned by podman, NOT a
    # fixed "host:container" mapping. See the module-level comment above.
    ports:
      - "5000"
    # SINGLE WORKER — this is a determinism fix, not a tuning knob, and it
    # is the root cause of the live gate's startup flakiness. MLflow's
    # default worker count has every uvicorn worker independently import
    # the full FastAPI/SQLAlchemy/Alembic stack at once; on this 4-vCPU
    # podman VM they contend, uvicorn's supervisor kills the workers that
    # overrun its startup timeout, and respawns them — so startup stretches
    # unboundedly under load. Measured back-to-back under IDENTICAL
    # conditions — same image (cc5080a8ca0c), same clean volume, and the
    # same unrelated container (agx-qdrant) resident for both arms, so the
    # host was NOT idle and the comparison is a controlled A/B rather than
    # a best-case number:
    #   default   -> 41s to "Application startup complete", repeated
    #                "Child process [N] died" crash-loop
    #   --workers 1 -> 8s, ZERO child deaths
    # That one cause produced BOTH observed gate failures: the container
    # never reporting healthy inside the 120s poll, and the client's
    # RemoteDisconnected (a request landing on a worker that was then
    # killed mid-flight). Concurrency is not under test here — this stack
    # serves one pytest process — so a worker pool buys nothing and costs
    # determinism. Do NOT "fix" a recurrence by raising the poll budget;
    # see sinks.py on why bigger numbers are not a fix. Do NOT change
    # --workers for the host-allowlist work below either — settled and
    # pinned by test on the parent branch, orthogonal to this knob.
    #
    # HOST ALLOWLIST (p3) — no flags here. The allowlist arrives entirely
    # through MLFLOW_SERVER_ALLOWED_HOSTS / MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
    # under `environment:` above; see that block for the mechanism and the
    # injection history. This command: is therefore a FLAT ARGV LIST with no
    # shell and no `$` in any entry, which is the property
    # tests/test_compose_config.py pins.
    #
    # A RETRACTION, because this file's comments are treated as evidence.
    # An earlier revision wrapped this command in `sh -c` so two
    # `$${VAR:+--flag "$$VAR"}` blocks could make the flags OPTIONAL, and
    # justified that machinery with a measured claim: that passing
    # `--cors-allowed-origins ""` "HANGS the server ... burns CPU
    # indefinitely inside CORS middleware setup and never binds". THAT CLAIM
    # DOES NOT REPRODUCE. Re-probed against the same pinned image, one
    # container at a time:
    #   control, no vars/flags                          bound in 8s
    #   env vars both ""                                bound in 7s
    #   CLI --cors-allowed-origins ""                   bound in 8s
    #   CLI --cors-allowed-origins "" (repeat)          bound in 7s
    #   CLI both flags ""                               bound in 7s
    #   real compose stack (postgres + R2), flat argv,
    #     --cors-allowed-origins ""                     healthy
    # The likely cause of the original reading is the same contention
    # artifact documented under --workers below: THREE mlflow containers
    # booting at once on this 4-vCPU VM all appear to hang, control
    # included. Probe sequentially or you will measure the VM, not mlflow.
    #
    # So the optional-flag problem the wrapper solved was not real — and the
    # native env vars make it moot regardless, since there is no flag to
    # make optional. Deleting the wrapper also deletes the only place in
    # this whole compose/Containerfile surface where an externally-set value
    # was spliced into shell-command text.
    #
    # REPLACE, NOT EXTEND: a set allowlist REPLACES mlflow's compiled
    # default outright — verified empirically, a server configured with a
    # custom allowlist 403s a PLAIN request with no Host override (i.e.
    # exactly what a client at localhost:<ephemeral-port> sends). These vars
    # must stay unset for `just container-test`'s own stack, or the live
    # gate 403s itself — see the guard note in scripts/run_container_test.sh.
    #
    # NEVER '*': mlflow accepts a wildcard allowlist value, which disables
    # the DNS-rebinding guard entirely. Forbidden here regardless of
    # convenience — no default, no fallback, ever resolves to '*'. NOTE this
    # file cannot enforce that at deploy time: Railway supplies its own env,
    # never this compose file, so the wildcard guard belongs with the deploy
    # topology, not here.
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres:5432/mlflow
      - --artifacts-destination
      - s3://entropic-substrate-lm/mlflow/
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:5000/health')",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

# Named so a failure-path teardown (`down` without `-v`) leaves something an
# operator can actually find and inspect: `${PROJECT}_pgdata`.
volumes:
  pgdata:
