[project]
name = "entropic-substrate-lm"
version = "0.9.1"
description = "Substrate-level symbol encoding experiments — Fisher-Rao init, nGPT hypersphere backbone, gated κ-stereographic normalization"
requires-python = ">=3.12"
readme = "README.md"
# Runtime deps: geometry-aware LM stack. The torch version must match the CUDA
# wheel already installed by the H100 base image; local/CI installs select the
# CPU wheel explicitly where needed (see Containerfile / .github/workflows/ci.yaml).
dependencies = [
  "torch==2.13.0",
  "numpy>=1.26.0",
  "datasets>=3.6.0",
  "tiktoken>=0.8.0",
  "pyyaml>=6.0.2",
  # Sentence-span identity binds the exact offline boundary engine version.
  "pysbd==0.3.4",
  "loguru>=0.7.3",
  # HTTP tracking client for run metrics (entropic_substrate.sinks). The full
  # MLflow server distribution is isolated in Containerfile.mlflow; keeping it
  # out of the training runtime avoids importing server/UI dependency policy
  # (including MLflow 3.15's cryptography<50 cap) into the model environment.
  "mlflow-skinny==3.15.0",
]

[dependency-groups]
deploy = [
  # The R2 worker imports the S3 client directly; do not rely on DVC transitives.
  "boto3>=1.34.0",
  # The worker directly uses Config to bound SDK timeouts and retries.
  "botocore>=1.34.0",
  # Portable successor verification recomputes sealed paired statistical results.
  "scipy>=1.15.0",
  # scripts/run_ladder.sh performs dvc add/push on the pod after every rung.
  # Keep that operational dependency explicit without shipping test tooling.
  "dvc[s3]>=3.59.0",
  # MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING (entropic_substrate.sinks) is
  # mlflow-native, but mlflow-skinny does NOT declare either as a dependency
  # (verified 2026-08-17 via `importlib.metadata.requires("mlflow-skinny")`)
  # — psutil happened to be present transitively (torch) in this dev venv,
  # which is exactly the kind of accidental coverage that silently vanishes
  # on a different base image. Pinned here, not in dev: the unit suite
  # (tests/test_sinks.py) injects a fake monitor factory and never imports
  # either — this is training-pod-only observability.
  "psutil>=6.0.0",
  "pynvml>=12.0.0",
]
# Interpretation charts (entropic_substrate.analysis, notebooks/) — matplotlib
# figures attached retroactively to MLflow runs, plus ad-hoc plotly/marimo
# notebooks over DVC-captured JSONLs. DEV-SIDE ONLY, deliberately its own group
# rather than folded into `dev` directly: a training pod's environment is built
# from `deploy` alone (see Containerfile's `uv export --group deploy`), and
# these three have no business anywhere near it — an analysis library on a
# training pod is dead weight at best and, on the H100 image's already-tight
# CUDA/torch dependency resolution, a resolver hazard at worst. `dev` includes
# this group so the unit suite (tests/test_analysis_charts.py and siblings)
# can import matplotlib/marimo/plotly.
analysis = [
  # Registered paired-test quantiles, pilot variance bounds and power calculations.
  "scipy>=1.15.0",
  "matplotlib>=3.10.0",
  "marimo>=0.23.16",
  "plotly>=5.24.0",
]
dev = [
  { include-group = "deploy" },
  { include-group = "analysis" },
  # Test-time oracle only: production geometry is implemented in-tree. geoopt
  # ships fixes on GitHub ahead of PyPI, so retain the repository source.
  "geoopt @ git+https://github.com/geoopt/geoopt.git",
  "ruff>=0.11.0",
  "basedpyright>=1.37.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.26.0",
  "deptry>=0.20.0",
  "bandit>=1.8.0",
  # The unit suite exercises MLflow's real local SQLite store. These are store
  # adapters for tests only; production tracking goes over HTTP to the
  # containerized server.
  "sqlalchemy>=1.4.0,<3",
  "alembic!=1.10.0,<2",
  "jsonschema>=4.26.0",
  "pytest-xdist>=3.6",
  # p0-contract-pin (E-8 ratified at sprint-preflight): the layers contract
  # over kernel/core/ladder/historical/composition, __legacy deliberately
  # outside it until p13 (DN-P1). `just check` runs it as `lint-imports`.
  "import-linter>=1.0",
  "gitlint>=0.19.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# uv — dependency cooldown (supply-chain): hold back freshly-published releases.
# Anchored at repo inception rather than a rolling window; the weekly sweep
# (mirrors doc-lora-training convention) advances this date forward over time,
# which is how security patches get pulled in without a blanket rollback.
# ---------------------------------------------------------------------------
[tool.uv]
exclude-newer = "2026-08-13T00:00:00Z"
# Security floors stay attached to the transitive dependency boundary: they
# constrain packages already required by MLflow/DVC without promoting those
# implementation details to first-party dependencies.
constraint-dependencies = [
  "cryptography>=50.0.0",
  "gitpython>=3.1.58",
]

# ---------------------------------------------------------------------------
# ruff — linting + formatting (mirrors doc-lora-training convention)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["references"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line too long — handled by formatter
  "RUF001", # ambiguous unicode (strings) — math notation (κ, α, √, ×, ≈) is intentional here
  "RUF002", # ambiguous unicode (docstrings) — ditto
  "RUF003", # ambiguous unicode (comments) — ditto
]

[tool.ruff.lint.isort]
known-first-party = ["entropic_substrate"]

[tool.ruff.lint.per-file-ignores]
# marimo's own on-disk cell format uses a bare trailing expression as "this
# is the cell's displayed output" (the same convention as a Jupyter cell) —
# that is the idiom, not an oversight, and B018 has no way to distinguish
# the two.
"notebooks/*.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# basedpyright — strict type checking (supersedes mypy; mirrors sibling repos).
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# scripts/ carries the exit-gate typestate core (scripts/exit_gate.py); the
# typestate contract (module-private brand, certificate-by-type transition) is
# only real if the checker sees it. Mirrors .pre-commit-config.yaml's
# basedpyright `files: ^(src/entropic_substrate/|scripts/)` and `just typecheck`.
include = ["src", "scripts"]
exclude = ["**/__pycache__", "tests", "build", "references"]
reportMissingImports = false
reportMissingTypeStubs = false
# torch ships partial stubs, so strict's reportUnknown* family fires on every
# Tensor method (87 errors on the untouched scaffold — the gate was never
# passable). Our own annotations remain strict-checked; only third-party
# inference gaps are silenced. Decision: Luiz, 2026-08-11.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

# ---------------------------------------------------------------------------
# bandit — security linting (invoked as `bandit -c pyproject.toml -q -r src`)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv", "references"]

# ---------------------------------------------------------------------------
# deptry — dependency hygiene
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["entropic_substrate"]
# Optional host capabilities are production source, not test-only dependencies.
# This classification does not change which groups the training image installs.
non_dev_dependency_groups = ["deploy", "analysis"]

[tool.deptry.per_rule_ignores]
# DVC is invoked as a CLI (scripts/run_ladder.sh); psutil is loaded by MLflow's
# system-metrics plugin. Neither usage is a first-party Python import.
DEP002 = ["dvc", "psutil"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references", ".git", "__pycache__", "*.egg-info"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
  "unit: fast hermetic unit tests (CPU, <60s)",
  "integration: multi-component integration tests",
]

# ---------------------------------------------------------------------------
# commitizen — commit-message schema (pre-commit: `commitizen`, `commitizen-branch`)
#
# `cz check` is the repo's only conventional-commit gate: gitlint runs its
# default rules, which do not include CT1. So this pattern is load-bearing, and
# `tests/test_commit_schema.py` pins both of its arms.
#
# Why cz_customize rather than the stock plugin. MEASURED 2026-08-16, commitizen
# 4.11.6: a top-level `[tool.commitizen] schema_pattern` is parsed and then
# IGNORED — `ConventionalCommitsCz.schema_pattern()` returns a hardcoded regex
# and never reads the setting. `cz check` output under that config is
# byte-identical to the no-config control. Only cz_customize consults the key.
# Cost of the swap, also measured: `cz commit` raises `KeyError: 'type'` without
# a `questions` block. Nothing here calls it — authoring goes through
# `just stack`, and cz appears in exactly two pre-commit hooks, both `cz check`.
#
# The delta from stock is one alternative: GitHub composes a squash-merge
# subject as `<PR title> (#N)`, and `gt submit --ai` sometimes wraps the title
# in a code fence, yielding ``docs(x): y` (#33)` — conventional inside, but not
# at position 0, where `cz check` anchors. Commits 24ddc3c (#32) and 0c6bed7
# (#33) are already merged onto shared branches and authored by GitHub, so they
# are not rewritable. The fence is admitted ONLY with the trailing `(#N)` that
# identifies forge output; a fenced subject written locally still fails.
#
# Forked from 4.11.6's default, so it does not inherit commit types added
# upstream — re-check the type list when the pre-commit hook rev is bumped.
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema = "<type>(<scope>): <subject>"
example = "fix(compose): pin one mlflow worker to make the live gate deterministic"
info = """Conventional Commits, plus GitHub squash-merge subjects of the form
`<conventional subject>` (#N). Title <= 72 chars is enforced separately by gitlint.
"""
schema_pattern = '(?s)(?:(?:build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\(\S+\))?!?: [^\n\r]+|`(?:build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\(\S+\))?!?: [^\n\r]+` \(#\d+\))(?:(?:\n\n.*)|(?:\s*))?$'
