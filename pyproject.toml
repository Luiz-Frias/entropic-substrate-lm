[project]
name = "entropic-substrate-lm"
version = "0.1.0"
description = "Substrate-level symbol encoding experiments — Fisher-Rao init, nGPT hypersphere backbone, gated κ-stereographic normalization"
requires-python = ">=3.12"
readme = "README.md"
# Runtime deps: geometry-aware LM stack. The torch version must match the CUDA
# wheel already installed by the H100 base image; local/CI installs select the
# CPU wheel explicitly where needed (see Containerfile / .github/workflows/ci.yaml).
dependencies = [
  "torch==2.13.0",
  "numpy>=1.26.0",
  "datasets>=3.6.0",
  "tiktoken>=0.8.0",
  "pyyaml>=6.0.2",
  "loguru>=0.7.3",
  # HTTP tracking client for run metrics (entropic_substrate.sinks). The full
  # MLflow server distribution is isolated in Containerfile.mlflow; keeping it
  # out of the training runtime avoids importing server/UI dependency policy
  # (including MLflow 3.15's cryptography<50 cap) into the model environment.
  "mlflow-skinny==3.15.0",
]

[dependency-groups]
deploy = [
  # scripts/run_ladder.sh performs dvc add/push on the pod after every rung.
  # Keep that operational dependency explicit without shipping test tooling.
  "dvc[s3]>=3.59.0",
]
dev = [
  { include-group = "deploy" },
  # Test-time oracle only: production geometry is implemented in-tree. geoopt
  # ships fixes on GitHub ahead of PyPI, so retain the repository source.
  "geoopt @ git+https://github.com/geoopt/geoopt.git",
  "ruff>=0.16.2",
  "basedpyright>=1.37.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.26.0",
  "deptry>=0.20.0",
  "bandit>=1.8.0",
  "boto3>=1.34.0",
  # The unit suite exercises MLflow's real local SQLite store. These are store
  # adapters for tests only; production tracking goes over HTTP to the
  # containerized server.
  "sqlalchemy>=1.4.0,<3",
  "alembic!=1.10.0,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# uv — dependency cooldown (supply-chain): hold back freshly-published releases.
# Anchored at repo inception rather than a rolling window; the weekly sweep
# (mirrors doc-lora-training convention) advances this date forward over time,
# which is how security patches get pulled in without a blanket rollback.
# ---------------------------------------------------------------------------
[tool.uv]
exclude-newer = "2026-08-13T00:00:00Z"
# Security floors stay attached to the transitive dependency boundary: they
# constrain packages already required by MLflow/DVC without promoting those
# implementation details to first-party dependencies.
constraint-dependencies = [
  "cryptography>=50.0.0",
  "gitpython>=3.1.58",
]

# ---------------------------------------------------------------------------
# ruff — linting + formatting (mirrors doc-lora-training convention)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["references"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line too long — handled by formatter
  "RUF001", # ambiguous unicode (strings) — math notation (κ, α, √, ×, ≈) is intentional here
  "RUF002", # ambiguous unicode (docstrings) — ditto
  "RUF003", # ambiguous unicode (comments) — ditto
]

[tool.ruff.lint.isort]
known-first-party = ["entropic_substrate"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# basedpyright — strict type checking (supersedes mypy; mirrors sibling repos).
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# scripts/ carries the exit-gate typestate core (scripts/exit_gate.py); the
# typestate contract (module-private brand, certificate-by-type transition) is
# only real if the checker sees it. Mirrors .pre-commit-config.yaml's
# basedpyright `files: ^(src/entropic_substrate/|scripts/)` and `just typecheck`.
include = ["src", "scripts"]
exclude = ["**/__pycache__", "tests", "build", "references"]
reportMissingImports = false
reportMissingTypeStubs = false
# torch ships partial stubs, so strict's reportUnknown* family fires on every
# Tensor method (87 errors on the untouched scaffold — the gate was never
# passable). Our own annotations remain strict-checked; only third-party
# inference gaps are silenced. Decision: Luiz, 2026-08-11.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

# ---------------------------------------------------------------------------
# bandit — security linting (invoked as `bandit -c pyproject.toml -q -r src`)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv", "references"]

# ---------------------------------------------------------------------------
# deptry — dependency hygiene
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["entropic_substrate"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references", ".git", "__pycache__", "*.egg-info"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
  "unit: fast hermetic unit tests (CPU, <60s)",
  "integration: multi-component integration tests",
]
