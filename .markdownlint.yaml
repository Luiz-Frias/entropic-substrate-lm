# markdownlint-cli2 configuration for entropic-substrate-lm
# Docs: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
default: true

# Allow long lines — prose wrapping is handled by dprint, and tables/URLs
# routinely exceed an arbitrary column count.
MD013: false

# Allow inline HTML (used sparingly for badges / details blocks).
MD033: false

# Allow duplicate headings across different sections (e.g. "Overview" per experiment).
MD024:
  siblings_only: true

# Allow first line to not be a top-level heading in partial/include-style docs.
MD041: false

# Ordered lists: allow either style (1. 1. 1. or 1. 2. 3.).
MD029:
  style: "ordered"
