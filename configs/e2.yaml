# E2: hypersphere-native backbone (nGPT-style Norm-as-retraction blocks,
# learnable eigen-LR alpha residual interpolation, unit-norm weight matrices).
# Parameter-matched to E0/E1 at 9 layers (SwiGLU gate makes each block wider).
name: e2

model:
  d_model: 768
  n_layers: 9
  n_heads: 12
  mlp_ratio: 4.0
  block_size: 1024
  dropout: 0.0
  bias: false
  tokenizer: byte
  block: ngpt
  norm: ngpt_norm
  # ASSUMPTION: pre-commits to fisher_sqrt as the "E1 winner" (docs/e-3-instruction.md
  # says to determine this empirically). If e1-random wins, flip this to random_sphere
  # so E1→E2 stays a one-variable change.
  embedding_init: fisher_sqrt
  fisher_init_path: data/fisher_init_d768.pt
  tie_embeddings: true
  alpha_init: 0.05

data:
  source: enwik8
  path: data/enwik8/enwik8
  val_fraction: 0.05
  batch_size: 16
  seq_len: 1024
  num_eval_batches: 20

train:
  max_steps: 20000
  lr: 0.0015
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.0
  grad_clip: 1.0
  eval_interval: 500
  log_interval: 20
  seed: 42
  amp_dtype: bf16
  device: auto
