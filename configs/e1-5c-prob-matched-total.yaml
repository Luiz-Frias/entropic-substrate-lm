# CORRECTED 2026-08-21 — d_model was 756, which is INVALID: 756 / n_heads 12
# = head_dim 63, and RoPE rotates coordinate PAIRS, so an odd head_dim is
# refused (models/blocks.py rotary_embeddings). MEASURED: four pods carrying
# the 756 config raised `ValueError: head_dim must be even for RoPE, got 63`
# on their first forward pass, and — because the pod command joins with
# `; sleep infinity` — kept billing for ~4 GPU-hours each while their MLflow
# runs sat at RUNNING with zero metrics. Config parse now refuses an odd
# head_dim outright (config.py __post_init__); this file moves to 744
# (head_dim 62, even), the nearest valid width BELOW 768 that keeps
# n_heads=12 — the lane's declared axis is d_model, so changing n_heads
# instead (756/14 or 756/6 are also even) would introduce a SECOND axis.
# COST OF THE FIX, stated plainly: the total moves 82,940,244 -> 80,344,872,
# i.e. from 2.6% under e1-fisher's 85,150,464 to 5.6% under. With n_heads=12
# there is no width between 744 and 768, so "matched-total" is approximate
# either way; DECISION-NEEDED if the operator prefers exact-total at the
# cost of the head count.
# E1.5c-prob, MATCHED-TOTAL twin (docs/e1_5-instruction.md "Comparison
# lanes"; FOR-925) — see e1-5c-field-matched-total.yaml's header for the
# lane's rationale. Axis vs e1-5c-prob: d_model (768 -> 756) +
# fisher_init_path (null; see the field twin's header).
#
# Exact total (test_config.py, _total_params, cross-checked against a real
# build_model count): same as the field twin — P shares F's p_phi exactly
# (no sqrt, same fixed lift, no new params) — 82,940,244.
# RETRACTION 2026-08-20: this read "82,494,720 + 425,984 = 82,920,704",
# the norm-blind formula's output; see the field twin's header for the
# corrected decomposition.
name: e1-5c-prob-matched-total

model:
  d_model: 744
  n_layers: 12
  n_heads: 12
  mlp_ratio: 4.0
  block_size: 1024
  dropout: 0.0
  bias: false
  tokenizer: byte
  block: baseline
  norm: layernorm
  embedding_init: fisher_sqrt
  fisher_init_path: null
  tie_embeddings: true
  state_source: field
  field_state: prob
  field_n_layers: 2
  field_d_model: 128
  field_n_heads: 4

data:
  source: enwik8
  path: data/enwik8/enwik8
  val_fraction: 0.05
  batch_size: 16
  seq_len: 1024
  num_eval_batches: 20

train:
  max_steps: 20000
  lr: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  log_interval: 20
  seed: 42
  amp_dtype: bf16
  device: auto
