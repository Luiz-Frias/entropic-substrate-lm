# CUDA/bf16 smoke overlay. Budgets match d1-tiny; stabilization remains arm-owned.
kind: d1-gpu-tiny-overlay

encoder:
  latent_width: 64
  n_layers: 2
  n_heads: 4
  block_size: 256

future_law:
  predictor_hidden_width: 64

data:
  source: synthetic
  synthetic_bytes: 200000
  batch_size: 4
  seq_len: 128
  val_fraction: 0.1
  num_eval_batches: 4

train:
  max_steps: 200
  lr: 0.003
  warmup_steps: 10
  eval_interval: 50
  log_interval: 10
  save_interval: 0
  amp_dtype: bf16
  device: cuda
