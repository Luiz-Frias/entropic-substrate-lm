# E1.5a-output: e1-fisher with the OUTPUT classifier frozen at its
# Fisher-Rao init value while the rest of the backbone trains freely.
# Axis: embedding_freeze (+ entailed tie_embeddings: false - a tied table
# cannot be frozen on only one of its two roles). See docs/e1_5-instruction.md.
name: e1-5a-output

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  mlp_ratio: 4.0
  block_size: 1024
  dropout: 0.0
  bias: false
  tokenizer: byte
  block: baseline
  norm: layernorm
  embedding_init: fisher_sqrt
  fisher_init_path: data/fisher_init_d768.pt
  tie_embeddings: false
  embedding_freeze: output

data:
  source: enwik8
  path: data/enwik8/enwik8
  val_fraction: 0.05
  batch_size: 16
  seq_len: 1024
  num_eval_batches: 20

train:
  max_steps: 20000
  lr: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  log_interval: 20
  seed: 42
  amp_dtype: bf16
  device: auto
