# E1.5c-prob: the P leg of the four-arm table (docs/e1_5-instruction.md
# Repair 2, FOR-924) - e1-5c-field with state z_t = p_phi(. | x_<=t) . Q,
# the same fixed lift Q but WITHOUT the sqrt map, isolating "explicitly
# predictive" from "Fisher geometry beyond exposing probabilities" (F-P
# contrast) - the cleanest control for the sqrt map itself. Shares
# e1-5c-field's p_phi architecture/size/context exactly - axis: state_source
# + field_state.
name: e1-5c-prob

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  mlp_ratio: 4.0
  block_size: 1024
  dropout: 0.0
  bias: false
  tokenizer: byte
  block: baseline
  norm: layernorm
  embedding_init: fisher_sqrt
  fisher_init_path: data/fisher_init_d768.pt
  tie_embeddings: true
  state_source: field
  field_state: prob
  field_n_layers: 2
  field_d_model: 128
  field_n_heads: 4

data:
  source: enwik8
  path: data/enwik8/enwik8
  val_fraction: 0.05
  batch_size: 16
  seq_len: 1024
  num_eval_batches: 20

train:
  max_steps: 20000
  lr: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  log_interval: 20
  seed: 42
  amp_dtype: bf16
  device: auto
