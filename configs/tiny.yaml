# CPU smoke overlay: merged on top of any experiment via `--tiny`.
# Keeps the experiment's tokenizer / block / norm / init choices and shrinks
# everything else so a full run finishes in seconds.
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  block_size: 256
  fisher_init_path: null

data:
  source: synthetic
  synthetic_bytes: 200000
  batch_size: 4
  seq_len: 128
  val_fraction: 0.1
  num_eval_batches: 4

train:
  max_steps: 200
  lr: 0.003
  warmup_steps: 10
  eval_interval: 50
  log_interval: 10
  save_interval: 0
  amp_dtype: "off"
  device: cpu
