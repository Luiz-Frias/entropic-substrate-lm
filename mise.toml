# mise.toml — entropic-substrate-lm
# Pins: python 3.12.15 (exact: the identity regime table keys on the patch version), uv (pkg mgr), just (task runner), prek (Rust pre-commit runner),
# shellcheck/shfmt/bats (shell linting/testing), dprint (Markdown/config formatting),
# graphite (stacked-PR CLI).
# Mirrors doc-lora-training convention.
[env]
_.python.venv = { path = ".venv", create = true }
_.file = ".env"                          # loads HF_TOKEN, WANDB_API_KEY, R2/RunPod creds, etc.

[settings.python]
uv_venv_auto = true

[tools]
python = "3.12.15"
uv = "latest"
just = "latest"
"github:j178/prek" = "latest"
shellcheck = "latest"
shfmt = "latest"
bats = "latest"
"ubi:dprint/dprint" = "0.54.0"
# Graphite CLI — this repo ships as stacked PRs, so `gt` is toolchain, not a
# personal preference. Pinned rather than "latest": it rewrites branch
# parent/child metadata, and a silent CLI upgrade mid-stack is not something to
# discover from a restack. Registry entry resolves to withgraphite's tap.
# `gt auth` still needs a per-user token — that is a SECRET and never lands
# here; see the House rules in CLAUDE.md.
graphite = "1.8.6"

# Shell tasks delegate to just — keeps a single source of truth for recipes.
[tasks.check]
description = "Quality gate (fmt-check + lint + typecheck + unit tests)"
run = "just check"

[tasks.check-all]
description = "Full gate including integration tests"
run = "just check && just test-all"

[tasks.train]
description = "Run a training experiment (wraps just train)"
run = "just train"

[tasks.download-data]
description = "Download experiment datasets (wraps just download-data)"
run = "just download-data"

[tasks.gate]
description = "Pre-commit + pre-push gate (prek)"
run = "just pc-ci"
